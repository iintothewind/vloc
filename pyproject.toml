[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vloc"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "pydantic==2.14.2",
  "httpx==0.28.1",
  "numpy==2.2.6",
  "Pillow==12.2.0",
]

[project.optional-dependencies]
test = ["pytest==9.2.0"]

[tool.setuptools]
packages = ["vloc"]
